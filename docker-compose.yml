version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: furnishop_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: furnishop
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: furnishop_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@furnishop.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
